name: Build and validate

on:
  push:
  pull_request:

jobs:
  python-and-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Run Python tests
        run: python -m unittest discover -v
      - name: Build C++ with sanitizers
        run: |
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Debug -DLOB_ENABLE_SANITIZERS=ON
          cmake --build build-ci --parallel
      - name: Run C++ tests
        run: ctest --test-dir build-ci --output-on-failure
      - name: Verify C++ behavioral parity
        run: python compare_cpp.py --events 10000 --seed 29 --binary build/order_book_cli
      - name: Verify full feed replay path
        run: python tests/run_wselob_replay_smoke.py
